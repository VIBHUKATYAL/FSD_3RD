<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SHOP</title>
    <style>
        table{
            width:80%;
            margin:auto;
            padding:10px;
            font-size:25px;
            color:red;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <table>
        <tbody id="data">

        </tbody>
    </table>
    <script>
        const ele=document.getElementById("data");
        const URL="https://dummyjson.com/products";
        async function loadProduct(){
            try{
                const res=await fetch(URL);
                const data=await res.json();
                console.log("Data=",data.products);
                let row="";
                data.products.map((i,index)=>{
                    row+=`
                    <thead>
                        <tr>
                            <th>Serial no.</th>
                            <th>Title</th>
                            <th>Image</th>
                            <th>Price</th>
                            <th>Category</th>
                        </tr>
                    </thead>
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><center><img src=${i.images[0]} width=20%></center></td>
                        <td>${i.price}</td>
                        <td>${i.category}</td>
                    </tr>
                    `;
                    ele.innerHTML=row;
                })
            }
            catch(err){
                console.log("ERROR",err);
                ele.innerHTML=`<tr>Network Error</tr>`; 
            }
        }
        loadProduct();
    </script>
</body>
</html>
