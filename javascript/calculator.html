<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const multiply = (x,y) => {return x*y};
        const sum=(x,y) => {return x+y};
        const divide=(x,y) => { 
            if(y!=0) return x/y;
            else return "Y can't be zero";
        }
        const sub=(x,y) =>{return x-y};
        document.write("Multiply: ",multiply(10,20));
        document.write("Sum: ",sum(10,20));
        document.write("Divide: ",divide(10,20));
        document.write("Subtract: ",sub(10,20));
    </script>
</body>
</html>
