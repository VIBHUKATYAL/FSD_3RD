<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <div id="header">
    <h1>Bus Booking System</h1>
    </div>
    </center>
    <div id="info">
        <center>
            <h3>User Information</h3>
        </center>
    </div>
    <form id="main">
    <form id="User-Info">
        <label for="Name">User Name:</label>
        <input type="text" id="Name" required>
        <br><br>
        <label for="Age">User Age:</label>
        <input type="number" id="Age" required>
        <br><br>
        <label for="Adhaar-Number">Adhaar Number:</label>
        <input type="text" id="Adhaar-Number" required>
        <br><br>
        <label for="City">Select Your City:</label>
        <select name="City" id="City">
        <option value="Delhi">Delhi</option>
        <option value="Merrut">Merrut</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Leh">Leh</option>
        <option value="Chennai">Chennai</option>
        </select>
        <br><br>
        <label for="Date">Select Date:</label>
        <input type="date" id="Date">
    </form>
    <br><br>
    <div id="Bus-info">
        <center>
            <h3>Bus Information</h3>
        </center>
    </div>
    <form id="Bus">
        <label for="Bus-Type">Select your Bus Type:</label>
        <br>
        <input type="radio" id="AC" name="Bus-Type" value="AC" checked>
        <label for="AC">AC BUS 2000</label>
        <br>
        <input type="radio" id="NAC" name="Bus-Type" value="NAC">
        <label for="NAC">Non AC BUS 1500</label>
        <br><br>
        <label for="Seat">Select your Seat:</label>
        <select name="Seat" id="Seat">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        </select>
    </form>
    <br><br>
    <div id="book">
        <center>
            <button onclick="triggerEvent()">Book Now</button>
        </center>
    </div>
    <div id="status">

    </div>
    <script>
        let name=document.getElementById('Name');
        let adhaar=document.querySelector("#Adhaar-Name");
        function triggerEvent(){
            document.getElementById("status").innerHTML="Ticket Booked Successfully <br>";
            document.getElementById("status").innerHTML=`Passenger Name: ${name}`;


        }

    </script>
</body>
</html>
